name: Release Source Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-source:
    name: Release source checks
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check whitespace
        shell: pwsh
        run: git diff --check

      - name: Run release source guards
        shell: pwsh
        run: |
          $checks = @(
              "tests\run_release_policy_guard.ps1",
              "tests\run_phase9c_build_recipe_reliability.ps1"
          )

          foreach ($check in $checks) {
              Write-Host "Running $check"
              powershell -NoProfile -ExecutionPolicy Bypass -File $check
              if ($LASTEXITCODE -ne 0) {
                  throw "Release source check failed: $check"
              }
          }
