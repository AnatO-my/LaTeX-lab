name: Starter Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  starters:
    name: Starter documents
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MiKTeX
        shell: pwsh
        run: |
          $setupRoot = Join-Path $env:RUNNER_TEMP "miktex-setup"
          $repository = Join-Path $env:RUNNER_TEMP "miktex-repository"
          $installRoot = Join-Path $env:RUNNER_TEMP "miktex"
          $configRoot = Join-Path $env:RUNNER_TEMP "miktex-config"
          $dataRoot = Join-Path $env:RUNNER_TEMP "miktex-data"
          New-Item -ItemType Directory -Force -Path $setupRoot, $repository, $installRoot, $configRoot, $dataRoot | Out-Null

          $setupZip = Join-Path $setupRoot "miktexsetup.zip"
          Invoke-WebRequest "https://miktex.org/download/win/miktexsetup-x64.zip" -OutFile $setupZip
          Expand-Archive -LiteralPath $setupZip -DestinationPath $setupRoot -Force

          $setup = Get-ChildItem -LiteralPath $setupRoot -Recurse -Filter "miktexsetup_standalone.exe" |
              Select-Object -First 1
          if (-not $setup) {
              throw "miktexsetup_standalone.exe was not found after extracting the setup utility."
          }

          & $setup.FullName --quiet --local-package-repository=$repository --package-set=basic download
          if ($LASTEXITCODE -ne 0) {
              throw "MiKTeX package download failed with exit code $LASTEXITCODE."
          }

          & $setup.FullName --quiet `
              --local-package-repository=$repository `
              --package-set=basic `
              --shared=no `
              --user-install=$installRoot `
              --user-config=$configRoot `
              --user-data=$dataRoot `
              --modify-path=no `
              install
          if ($LASTEXITCODE -ne 0) {
              throw "MiKTeX install failed with exit code $LASTEXITCODE."
          }

          $tools = Get-ChildItem -LiteralPath $installRoot -Recurse -Include "latexmk.exe", "pdflatex.exe" -File
          $toolDirs = $tools | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique
          if (-not $toolDirs) {
              Write-Host "Installed MiKTeX tree:"
              Get-ChildItem -LiteralPath $installRoot -Recurse -Depth 4 | Select-Object -ExpandProperty FullName
              throw "MiKTeX tools were not found under $installRoot."
          }

          $toolDirs | ForEach-Object {
              Write-Host "Adding TeX tool directory to PATH: $_"
              $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          $env:PATH = ($toolDirs -join [System.IO.Path]::PathSeparator) + [System.IO.Path]::PathSeparator + $env:PATH
          initexmf --set-config-value "[MPM]AutoInstall=1"
          initexmf --update-fndb
          mpm --install=latexmk

      - name: Check TeX tools
        shell: pwsh
        run: |
          latexmk -version
          pdflatex --version

      - name: Check whitespace
        shell: pwsh
        run: git diff --check

      - name: Build starter documents
        shell: pwsh
        run: tests\run_phase7c_starter_tests.ps1

      - name: Upload starter PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-pdfs
          path: build/examples/**/*.pdf
          if-no-files-found: warn
