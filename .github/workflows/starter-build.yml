name: Starter Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  starters:
    name: Starter documents
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MiKTeX
        run: choco install miktex --no-progress -y

      - name: Discover MiKTeX
        shell: pwsh
        run: |
          $candidates = @(
              "${env:ProgramFiles}\MiKTeX\miktex\bin\x64",
              "${env:ProgramFiles}\MiKTeX\miktex\bin",
              "${env:ProgramFiles(x86)}\MiKTeX\miktex\bin\x64",
              "${env:ProgramFiles(x86)}\MiKTeX\miktex\bin",
              "${env:ChocolateyInstall}\lib\miktex\tools\miktex\bin\x64",
              "${env:ChocolateyInstall}\lib\miktex\tools\miktex\bin"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $miktexBin = $candidates | Select-Object -First 1
          if (-not $miktexBin) {
              Write-Host "Known MiKTeX-like directories:"
              Get-ChildItem -Path "${env:ProgramFiles}", "${env:ProgramFiles(x86)}", "${env:ChocolateyInstall}\lib" -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'MiKTeX|miktex' } |
                  Select-Object -ExpandProperty FullName
              throw "MiKTeX binary directory was not found."
          }

          Write-Host "Using MiKTeX binary directory: $miktexBin"
          $miktexBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Enable MiKTeX package installation
        shell: pwsh
        run: |
          initexmf --admin --set-config-value "[MPM]AutoInstall=1"
          initexmf --set-config-value "[MPM]AutoInstall=1"
          initexmf --admin --update-fndb
          initexmf --update-fndb

      - name: Check TeX tools
        shell: pwsh
        run: |
          latexmk -version
          pdflatex --version

      - name: Check whitespace
        shell: pwsh
        run: git diff --check

      - name: Build starter documents
        shell: pwsh
        run: tests\run_phase7c_starter_tests.ps1

      - name: Upload starter PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-pdfs
          path: build/examples/**/*.pdf
          if-no-files-found: warn
